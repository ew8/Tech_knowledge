---
- name: Refresh package cache on RedHat-family hosts
  ansible.builtin.dnf:
    update_cache: true
  when: ansible_facts.os_family == 'RedHat'

- name: Refresh package cache on Debian-family hosts
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts.os_family == 'Debian'

- name: Install chrony
  ansible.builtin.package:
    name: "{{ chrony_package_name }}"
    state: present

- name: Read current system timezone
  ansible.builtin.command:
    cmd: timedatectl show --property=Timezone --value
  register: current_timezone
  changed_when: false
  failed_when: false
  check_mode: false

- name: Set system timezone
  ansible.builtin.command:
    cmd: "timedatectl set-timezone {{ system_timezone }}"
  when:
    - current_timezone.rc == 0
    - current_timezone.stdout | trim != system_timezone
  changed_when: true

- name: Deploy chrony configuration
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: "{{ chrony_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony

- name: Enable and start chrony
  ansible.builtin.service:
    name: "{{ chrony_service_name }}"
    state: started
    enabled: true

- name: Apply pending chrony restart before time synchronization
  ansible.builtin.meta: flush_handlers

- name: Force an immediate time step
  ansible.builtin.command:
    cmd: chronyc makestep
  changed_when: false
